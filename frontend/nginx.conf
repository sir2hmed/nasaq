server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"frontend","phase":2}';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
