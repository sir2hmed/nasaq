map $http_x_forwarded_proto $nasaq_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

upstream nasaq_frontend {
    server frontend:5173;
}

upstream nasaq_laravel {
    server laravel:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    location = /healthz {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    location /api/ {
        proxy_pass http://nasaq_laravel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $nasaq_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location /sanctum/ {
        proxy_pass http://nasaq_laravel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $nasaq_forwarded_proto;
    }

    location / {
        proxy_pass http://nasaq_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $nasaq_forwarded_proto;
    }
}
